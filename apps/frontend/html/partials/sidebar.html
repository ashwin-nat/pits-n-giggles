<nav class="png-sidebar" aria-label="Pits n' Giggles navigation">
  <a class="png-sidebar-brand" href="/" title="Pits n' Giggles home">
    <img class="png-sidebar-logo" src="/logo.png" alt="Pits n' Giggles">
  </a>
  <div class="png-sidebar-links">
    <a class="png-sidebar-link{% if active_page == 'home' %} png-sidebar-link-active{% endif %}" href="/" title="Home">
      <i class="bi bi-house-door-fill png-sidebar-icon" aria-hidden="true"></i>
      <span class="png-sidebar-label">Home</span>
    </a>
    <a class="png-sidebar-link{% if active_page == 'live' %} png-sidebar-link-active{% endif %}" href="/live" title="Driver View (Live)">
      <i class="bi bi-car-front-fill png-sidebar-icon" aria-hidden="true"></i>
      <span class="png-sidebar-label">Driver View</span>
    </a>
    <a class="png-sidebar-link{% if active_page == 'eng-view' %} png-sidebar-link-active{% endif %}" href="/eng-view" title="Engineer View (Live)">
      <i class="bi bi-wrench-adjustable png-sidebar-icon" aria-hidden="true"></i>
      <span class="png-sidebar-label">Engineer View</span>
    </a>
    <a class="png-sidebar-link{% if active_page == 'save-viewer' %} png-sidebar-link-active{% endif %}" href="/save-viewer/" title="Save Data">
      <i class="bi bi-floppy-fill png-sidebar-icon" aria-hidden="true"></i>
      <span class="png-sidebar-label">Save Data</span>
    </a>
    <a class="png-sidebar-link{% if active_page == 'lap-analyzer' %} png-sidebar-link-active{% endif %}" href="/lap-analyzer/" title="Lap Analyzer">
      <!-- Trail-braking trace, not a stock icon: full brake held, then a smooth,
           gradual release down to zero -- distinct from bi-graph-up's straight
           uptrend, which reads as "growth", not "telemetry trace". Rendered via
           mask-image (see .png-icon-lap-analyzer), not <img>, so it still tracks
           currentColor -- same hover/active color shift every bi- glyph gets. -->
      <span class="png-sidebar-icon png-icon-lap-analyzer" aria-hidden="true"></span>
      <span class="png-sidebar-label">Lap Analyzer</span>
    </a>
  </div>
  <button type="button" class="png-sidebar-toggle" title="Collapse sidebar" aria-expanded="true">
    <i class="bi bi-chevron-bar-left png-sidebar-toggle-icon png-sidebar-toggle-icon-collapse" aria-hidden="true"></i>
    <i class="bi bi-chevron-bar-right png-sidebar-toggle-icon png-sidebar-toggle-icon-expand" aria-hidden="true"></i>
  </button>
</nav>
